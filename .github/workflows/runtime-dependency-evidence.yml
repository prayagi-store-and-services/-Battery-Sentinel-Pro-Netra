name: Runtime dependency evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Capture runtime versus build and test dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > dependency-evidence/release-runtime.txt
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > dependency-evidence/debug-runtime.txt
          gradle --no-daemon :app:dependencies --configuration debugUnitTestRuntimeClasspath > dependency-evidence/unit-test-runtime.txt
          gradle --no-daemon buildEnvironment :app:buildEnvironment > dependency-evidence/build-environment.txt
          printf '%s\n' "$GITHUB_SHA" > dependency-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-dependency-evidence
          path: dependency-evidence/
          if-no-files-found: error
