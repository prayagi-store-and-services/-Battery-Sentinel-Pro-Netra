name: Android PDF verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pdf-export-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Verify real PDF and render its page
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p app/build/ci-diagnostics
            bash -o pipefail -c 'gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=com.example.BatteryPdfExportTest --stacktrace 2>&1 | tee app/build/ci-diagnostics/pdf-instrumentation.log'
            mkdir -p app/build/outputs/pdf-verification
            adb pull /sdcard/Android/data/com.aistudio.batterysentinel.ntra/files/pdf-verification/. app/build/outputs/pdf-verification/
      - name: Upload real Android PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pdf-verification
          path: |
            app/build/outputs/pdf-verification/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/ci-diagnostics/pdf-instrumentation.log
          if-no-files-found: warn
