name: Guarded Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changelog
        run: |
          awk '/^## \[Unreleased\]/{flag=1;next}/^## /{flag=0}flag' CHANGELOG.md > /tmp/unreleased.md
          grep -Eq '^[[:space:]]*-[[:space:]]+' /tmp/unreleased.md
      - name: Compute semantic version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$latest" ]; then current="0.0.0"; current_code=0; else
            current="${latest#v}"
            current_code="$(gh release view "$latest" --json body --jq '.body' | sed -n 's/^versionCode:[[:space:]]*//p' | head -1)"
            current_code="${current_code:-0}"
          fi
          IFS=. read -r major minor patch <<< "$current"
          msg="${{ github.event.head_commit.message }}"
          if [[ "$msg" == feat\!* || "$msg" == *"BREAKING CHANGE"* ]]; then major=$((major+1)); minor=0; patch=0
          elif [[ "$msg" == feat* ]]; then minor=$((minor+1)); patch=0
          else patch=$((patch+1)); fi
          echo "version_name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "version_code=$((current_code+1))" >> "$GITHUB_OUTPUT"
      - name: Commit version bump
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path("gradle.properties")
          s=p.read_text()
          s=re.sub(r"^netraVersionCode=.*$", "netraVersionCode="+os.environ["VERSION_CODE"], s, flags=re.M)
          s=re.sub(r"^netraVersionName=.*$", "netraVersionName="+os.environ["VERSION_NAME"], s, flags=re.M)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git diff --cached --quiet || git commit -m "chore(release): bump version to $VERSION_NAME"
          git push origin HEAD:main

  android-debug:
    name: Android assembleDebug + full unit suite
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.3.1 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

  pdf-instrumentation:
    name: PDF instrumentation tests
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.3.1 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP=="kvm", MODE=="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

  codeql:
    name: CodeQL
    needs: gate
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, packages: read, actions: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.3.1 }
      - uses: github/codeql-action/init@v4
        with: { languages: java-kotlin, build-mode: manual }
      - run: gradle --no-daemon :app:assembleDebug
      - uses: github/codeql-action/analyze@v4
        with: { category: /language:java-kotlin }

  signed-release:
    name: Signed APK and GitHub Release
    needs: [gate, android-debug, pdf-instrumentation, codeql]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.3.1 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Restore signing key
        env: { KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }} }
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netra-release.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/netra-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signing certificate continuity
        env: { EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }} }
        run: |
          test -n "$EXPECTED_CERT_SHA256"
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]')"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"
      - name: Publish release only after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.gate.outputs.version_name }}
          VERSION_CODE: ${{ needs.gate.outputs.version_code }}
        run: |
          awk '/^## \[Unreleased\]/{flag=1;next}/^## /{flag=0}flag' CHANGELOG.md > /tmp/release-notes.md
          { printf "versionCode: %s\n\n" "$VERSION_CODE"; cat /tmp/release-notes.md; } > /tmp/body.md
          git tag "v$VERSION_NAME"
          git push origin "v$VERSION_NAME"
          gh release create "v$VERSION_NAME" app/build/outputs/apk/release/app-release.apk --title "Battery Sentinel Pro Netra v$VERSION_NAME" --notes-file /tmp/body.md
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("CHANGELOG.md")
          current=p.read_text()
          marker="## [Unreleased]"
          start=current.index(marker)
          body_start=start+len(marker)
          rest=current[body_start:]
          next_section=rest.find("\n## ")
          unreleased=rest if next_section < 0 else rest[:next_section]
          archived=f"## [{os.environ['VERSION_NAME']}]\n"+unreleased.strip()+"\n\n"
          after="" if next_section < 0 else rest[next_section+1:]
          p.write_text(current[:start]+marker+"\n\n"+archived+after)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(release): archive $VERSION_NAME changelog"
          git push origin HEAD:main
