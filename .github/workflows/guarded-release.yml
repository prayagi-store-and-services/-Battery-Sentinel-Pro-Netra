name: Guarded Release
permissions:
  contents: read
jobs:
  gate:
    name: Validate immutable release candidate
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_sha: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - name: Validate version and changelog
      id: version
      shell: bash
      run: |
        set -euo pipefail
        VERSION_NAME="$(sed -n 's/^netraVersionName=//p' gradle.properties)"
        VERSION_CODE="$(sed -n 's/^netraVersionCode=//p' gradle.properties)"
        [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
        awk '/^## \[Unreleased\]/{flag=1;next}/^## /{flag=0}flag' CHANGELOG.md > /tmp/unreleased.md
        grep -Eq '^[[:space:]]*-[[:space:]]+' /tmp/unreleased.md
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.release_sha }}
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - name: Set up Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Generate CI-only debug signing key
      run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
    - name: Build debug APK and run unit tests
      shell: bash
      run: |
        set -o pipefail
        mkdir -p app/build/ci-diagnostics
        gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee app/build/ci-diagnostics/android-build.log
    - name: Upload Compose renders for visual review
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compose-ui-renders
        path: |
          app/build/outputs/ui-renders/*.png
          app/build/test-results/testDebugUnitTest/*.xml
          app/build/ci-diagnostics/android-build.log
        if-no-files-found: warn
    needs: gate
  pdf-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.release_sha }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Generate CI-only debug signing key
      run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
    - name: Verify real PDF and render its page
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_2
        disable-animations: true
        script: |
          mkdir -p app/build/ci-diagnostics
          bash -o pipefail -c 'gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=com.example.BatteryPdfExportTest --stacktrace 2>&1 | tee app/build/ci-diagnostics/pdf-instrumentation.log'
          mkdir -p app/build/outputs/pdf-verification
          adb pull /sdcard/Android/data/com.aistudio.batterysentinel.ntra/files/pdf-verification/. app/build/outputs/pdf-verification/
    - name: Upload real Android PDF evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-pdf-verification
        path: |
          app/build/outputs/pdf-verification/
          app/build/reports/androidTests/connected/
          app/build/outputs/androidTest-results/connected/
          app/build/ci-diagnostics/pdf-instrumentation.log
        if-no-files-found: warn
    needs: gate
  codeql:
    name: CodeQL
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.release_sha }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Generate CI-only debug signing key
      run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
    - uses: github/codeql-action/init@v4
      with:
        languages: java-kotlin
        build-mode: manual
    - run: gradle --no-daemon :app:assembleDebug
    - uses: github/codeql-action/analyze@v4
      with:
        category: /language:java-kotlin
  signed-release:
    name: Signed APK and GitHub Release
    needs:
    - gate
    - android-debug
    - pdf-instrumentation
    - codeql
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.release_sha }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Restore signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netra-release.jks"
    - name: Build signed release APK
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/netra-release.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle --no-daemon :app:assembleRelease
    - name: Verify signing certificate continuity
      env:
        EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
      run: |
        test -n "$EXPECTED_CERT_SHA256"
        APK="app/build/outputs/apk/release/app-release.apk"
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
        ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]')"
        test "$ACTUAL" = "$EXPECTED_CERT_SHA256"
    - name: Publish release only after all checks pass
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION_NAME: ${{ needs.gate.outputs.version_name }}
        VERSION_CODE: ${{ needs.gate.outputs.version_code }}
        RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      run: |
        set -euo pipefail
        awk '/^## \[Unreleased\]/{flag=1;next}/^## /{flag=0}flag' CHANGELOG.md > /tmp/release-notes.md
        { printf "versionCode: %s\n\n" "$VERSION_CODE"; cat /tmp/release-notes.md; } > /tmp/body.md
        if gh release view "v$VERSION_NAME" >/dev/null 2>&1; then
          echo "Version already published. Increment the version in a reviewed PR."
          exit 1
        fi
        LATEST_CODE="$(gh release view --json body --jq '.body' 2>/dev/null | sed -n 's/^versionCode:[[:space:]]*//p' | head -1 || true)"
        if [ -n "$LATEST_CODE" ]; then [[ "$LATEST_CODE" =~ ^[0-9]+$ ]]; test "$VERSION_CODE" -gt "$LATEST_CODE"; fi
        gh release create "v$VERSION_NAME" app/build/outputs/apk/release/app-release.apk --target "$RELEASE_SHA" --title "Battery Sentinel Pro Netra v$VERSION_NAME" --notes-file /tmp/body.md
'on':
  workflow_dispatch: {}
concurrency:
  group: netra-production-release
  cancel-in-progress: false
